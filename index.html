<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Presupuestos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .progress {
            height: 30px;
            margin: 20px 0;
        }
        .progress-bar {
            transition: width 0.3s;
        }
        .accordion {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .accordion-item {
            border-bottom: 1px solid #ddd;
        }
        .accordion-header {
            background-color: #f7f7f7;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .accordion-content {
            display: none;
            padding: 10px;
            background-color: #fff;
        }
        .accordion-content.show {
            display: block;
        }
    </style>
</head>
<body class="container mt-5">
    <nav class="mb-4 d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Gestor de Presupuestos</h1>
        <button id="logoutBtn" class="btn btn-outline-danger">Cerrar Sesión</button>
    </nav>

    <!-- Formulario de presupuesto -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Nuevo Presupuesto</h3>
            <form id="form-presupuesto">
                <div class="mb-3">
                    <input type="text" id="nombrePresupuesto" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="mb-3">
                    <input type="number" id="montoPresupuesto" class="form-control" placeholder="Monto inicial" min="0"
                        step="0.01" required>
                </div>
                <button type="submit" class="btn btn-success">Crear</button>
            </form>
        </div>
    </div>

    <!-- Formulario de gastos -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Registrar Gasto</h3>
            <form id="form-gasto">
                <div class="mb-3">
                    <select id="presupuestoId" class="form-select" required>
                        <option value="">Seleccione un presupuesto</option>
                    </select>
                </div>
                <div class="mb-3">
                    <input type="text" id="descripcionGasto" class="form-control" placeholder="Descripción" required>
                </div>
                <div class="mb-3">
                    <input type="number" id="montoGasto" class="form-control" placeholder="Monto" min="0" step="0.01"
                        required>
                </div>
                <button type="submit" class="btn btn-warning">Agregar Gasto</button>
            </form>
        </div>
    </div>

    <!-- Formulario para Actualizar Presupuesto -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title">Actualizar Presupuesto</h3>
            <form id="update-presupuesto-form">
                <input type="hidden" id="presupuesto-id" value="">
                <div class="mb-3">
                    <input type="text" id="nombre-actualizar" class="form-control" placeholder="Nombre" required>
                </div>
                <div class="mb-3">
                    <input type="number" id="monto-actualizar" class="form-control" placeholder="Monto" min="0" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary">Actualizar Presupuesto</button>
            </form>
        </div>
    </div>

    <!-- Lista de presupuestos con acordeón simple -->
    <div id="accordionPresupuestos" class="accordion">
        <!-- Presupuestos y gastos se mostrarán aquí -->
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        window.onload = function () {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
            } else {
                cargarPresupuestos();
            }
        };

        // Crear presupuesto
        document.getElementById('form-presupuesto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const presupuesto = {
                nombre: document.getElementById('nombrePresupuesto').value,
                monto: parseFloat(document.getElementById('montoPresupuesto').value)
            };

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/presupuestos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(presupuesto)
                });

                if (!res.ok) throw new Error(await res.text());
                document.getElementById('form-presupuesto').reset();
                cargarPresupuestos();
            } catch (err) {
                alert('Error al crear presupuesto: ' + err.message);
            }
        });

        // Agregar gasto
        document.getElementById('form-gasto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const gasto = {
                presupuestoId: document.getElementById('presupuestoId').value,
                descripcion: document.getElementById('descripcionGasto').value,
                monto: parseFloat(document.getElementById('montoGasto').value)
            };

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/gastos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(gasto)
                });

                if (!res.ok) throw new Error(await res.text());
                document.getElementById('form-gasto').reset();
                cargarPresupuestos();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        // Eliminar presupuesto
        const eliminarPresupuesto = async (id) => {
            if (!confirm('¿Eliminar este presupuesto y sus gastos?')) return;

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/presupuestos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!res.ok) throw new Error(await res.text());
                cargarPresupuestos();
            } catch (err) {
                alert('Error eliminando presupuesto: ' + err.message);
            }
        };

        // Actualizar presupuesto
        document.getElementById('update-presupuesto-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('presupuesto-id').value;
            const nombre = document.getElementById('nombre-actualizar').value;
            const monto = parseFloat(document.getElementById('monto-actualizar').value);

            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/presupuestos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre, monto })
                });

                if (!res.ok) throw new Error(await res.text());
                alert('Presupuesto actualizado exitosamente');
                cargarPresupuestos();
            } catch (err) {
                alert('Error al actualizar presupuesto: ' + err.message);
            }
        });

        // Función para cargar presupuestos y gastos
        const cargarPresupuestos = async () => {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/presupuestos`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) throw new Error('Error al cargar presupuestos');
                const presupuestos = await res.json();
                console.log('Presupuestos:', presupuestos); // Debugging log

                // Mostrar presupuestos con acordeón simple
                const accordionContainer = document.getElementById('accordionPresupuestos');
                accordionContainer.innerHTML = '';

                presupuestos.forEach((p, index) => {
                    // Cargar gastos para cada presupuesto
                    fetch(`${API_URL}/gastos?presupuestoId=${p.id}`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    })
                    .then(gastosRes => gastosRes.json())
                    .then(gastos => {
                        console.log('Gastos para presupuesto ID', p.id, ':', gastos); // Debugging log

                        const gastosList = gastos.map(g => {
                            const monto = parseFloat(g.monto);
                            const montoFormatted = isNaN(monto) ? 'N/A' : `$${monto.toFixed(2)}`;
                            return `
                                <li class="list-group-item">
                                    <strong>${g.descripcion}</strong>: ${montoFormatted} - ${new Date(g.created_at).toLocaleString()}
                                </li>
                            `;
                        }).join('');

                        const accordionItem = document.createElement('div');
                        accordionItem.classList.add('accordion-item');
                        accordionItem.innerHTML = `
                            <div class="accordion-header" onclick="toggleAccordion(${index})">
                                ${p.nombre} (ID: ${p.id})
                            </div>
                            <div class="accordion-content">
                                <p>Total: $${p.monto.toFixed(2)}</p>
                                <p>Restante: $${p.restante.toFixed(2)}</p>
                                <div class="progress">
                                    <div class="progress-bar bg-success" role="progressbar"
                                        style="width: ${(p.restante / p.monto) * 100}%" aria-valuenow="${(p.restante / p.monto) * 100}"
                                        aria-valuemin="0" aria-valuemax="100">
                                        ${Math.round((p.restante / p.monto) * 100)}%
                                    </div>
                                </div>
                                <ul class="list-group mt-3">
                                    ${gastosList}
                                </ul>
                                <button class="btn btn-danger btn-sm mt-2" onclick="eliminarPresupuesto(${p.id})">
                                    Eliminar
                                </button>
                                <button class="btn btn-warning btn-sm mt-2 ms-2" onclick="editPresupuesto(${p.id}, '${p.nombre}', ${p.monto})">
                                    Editar
                                </button>
                            </div>
                        `;
                        accordionContainer.appendChild(accordionItem);
                    });
                });

                // Actualizar selector de presupuestos
                const select = document.getElementById('presupuestoId');
                select.innerHTML = '<option value="">Seleccione un presupuesto</option>' +
                    presupuestos.map((p) =>
                        `<option value="${p.id}">${p.nombre} (ID: ${p.id})</option>`
                    ).join('');

            } catch (err) {
                console.error(err);
            }
        };

        // Función para llenar el formulario de actualización
        function editPresupuesto(id, nombre, monto) {
            document.getElementById('presupuesto-id').value = id;
            document.getElementById('nombre-actualizar').value = nombre;
            document.getElementById('monto-actualizar').value = monto;
        }

        // Función para alternar el acordeón
        function toggleAccordion(index) {
            const contents = document.querySelectorAll('.accordion-content');
            contents[index].classList.toggle('show');
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });
    </script>

    <!-- No need for Bootstrap JS since we're using our own accordion -->
</body>
</html>
